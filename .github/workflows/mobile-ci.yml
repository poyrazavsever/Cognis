name: Mobile CI

on:
  pull_request:
    paths:
      - "apps/neta-mobile/**"
      - "packages/**"
      - "docs/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/neta-mobile/**"
      - "packages/**"
      - "docs/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:release:check
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_NETA_ORIGIN: https://demo.takeneta.com
      - run: pnpm --filter @neta/mobile exec expo export --platform ios --output-dir /tmp/neta-mobile-ios
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_NETA_ORIGIN: https://demo.takeneta.com
      - run: pnpm --filter @neta/mobile exec expo export --platform android --output-dir /tmp/neta-mobile-android
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_NETA_ORIGIN: https://demo.takeneta.com
